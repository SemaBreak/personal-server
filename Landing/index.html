<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f5">
  <title>Server</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #23332b;
      background: #f5f7f5;
      --green: #2f8f5b;
      --amber: #d99a1e;
      --red: #b94f45;
      --muted: #68776e;
      --border: #e0e8e1;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body { margin: 0; padding: 24px; }
    .page { width: min(100%, 560px); margin: 0 auto; }

    header { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2rem); overflow-wrap: anywhere; }
    .status { display: flex; gap: 8px; align-items: center; margin-top: 4px; color: var(--muted); font-size: 0.9rem; }
    .signout button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }

    .dot { width: 9px; height: 9px; flex: none; border-radius: 50%; background: #aab5ae; }
    .dot.ok { background: var(--green); }
    .dot.bad { background: var(--red); }
    .dot.pulse { animation: pulse 2s ease-out infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgb(47 143 91 / 50%); }
      70%, 100% { box-shadow: 0 0 0 7px rgb(47 143 91 / 0%); }
    }
    @media (prefers-reduced-motion: reduce) { .dot.pulse { animation: none; } }

    .layout { display: grid; gap: 16px; }
    @media (min-width: 900px) {
      .page { width: min(100%, 1040px); }
      .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
    }

    .card { padding: 16px 18px; border: 1px solid var(--border); border-radius: 14px; background: #fff; box-shadow: 0 8px 24px rgb(35 51 43 / 5%); }
    h2 { margin: 0 0 12px; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }

    .services { display: grid; gap: 12px; }
    .service {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 2px 12px;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid #dce7de;
      border-radius: 12px;
      background: #fff;
      color: inherit;
      text-decoration: none;
    }
    .service:hover, .service:focus-visible { border-color: #8eae98; background: #f4f8f4; }
    .service:focus-visible { outline: 3px solid rgb(53 115 90 / 30%); outline-offset: 2px; }
    .icon { grid-row: 1 / span 2; display: grid; width: 40px; height: 40px; place-items: center; border-radius: 10px; background: #e8f1eb; font-size: 1.25rem; }
    .name { color: #285d46; font-weight: 650; }
    .badge { padding: 2px 10px; border-radius: 999px; background: #e8f1eb; color: #285d46; font-size: 0.8rem; font-weight: 650; white-space: nowrap; }
    .badge:empty { display: none; }
    .arrow { grid-row: 1 / span 2; grid-column: 4; color: #8eae98; font-size: 1.2rem; }
    .detail { grid-column: 2 / span 2; min-width: 0; overflow: hidden; color: var(--muted); font-size: 0.85rem; text-overflow: ellipsis; white-space: nowrap; }

    .metric { display: grid; grid-template-columns: 5.5rem 1fr 3rem; gap: 2px 10px; align-items: center; margin: 10px 0; font-size: 0.9rem; }
    .metric-label { color: var(--muted); }
    .metric-label[title] { cursor: help; text-decoration: underline dotted; }
    .metric-bar { height: 8px; overflow: hidden; border-radius: 4px; background: #e8f1eb; }
    .metric-bar > div { height: 100%; background: var(--green); transition: width .4s; }
    .metric-bar > div.warn { background: var(--amber); }
    .metric-bar > div.high { background: var(--red); }
    .metric-pct { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
    .metric-text { grid-column: 2 / span 2; color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
    .metric-plain .metric-text { grid-column: 2 / span 2; color: inherit; font-size: 0.9rem; }

    #health-more-toggle { margin-top: 4px; padding: 0; border: 0; background: none; color: #285d46; font: inherit; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1 id="server-name">Server</h1>
        <div class="status"><span id="server-dot" class="dot"></span><span id="server-status">Checking…</span></div>
      </div>
      <form method="post" action="/login.php" class="signout">
        <input type="hidden" name="action" value="logout">
        <button type="submit">Sign out</button>
      </form>
    </header>

    <div class="layout">
      <section class="card" aria-labelledby="services-title">
        <h2 id="services-title">Services</h2>
        <div class="services">
          <a class="service" href="/daylight/">
            <span class="icon" aria-hidden="true">✅</span>
            <span class="name">Daylight</span>
            <span class="badge" id="daylight-badge"></span>
            <span class="arrow" aria-hidden="true">→</span>
            <span class="detail" id="daylight-detail">Tasks</span>
          </a>
          <a class="service" href="/np/">
            <span class="icon" aria-hidden="true">🛒</span>
            <span class="name">NP — Purchase plan</span>
            <span class="badge" id="np-badge"></span>
            <span class="arrow" aria-hidden="true">→</span>
            <span class="detail" id="np-detail">Items to buy</span>
          </a>
          <a class="service" href="/rss/">
            <span class="icon" aria-hidden="true">📰</span>
            <span class="name">RSS — Feed</span>
            <span class="badge" id="rss-badge"></span>
            <span class="arrow" aria-hidden="true">→</span>
            <span class="detail" id="rss-detail">News feed</span>
          </a>
        </div>
      </section>

      <section class="card" id="health" aria-labelledby="health-title">
        <h2 id="health-title">Server health</h2>
        <div class="status"><span id="health-dot" class="dot"></span><span id="health-status">Loading…</span></div>
        <div id="health-rows"></div>
        <div id="health-more" hidden></div>
        <button type="button" id="health-more-toggle" aria-expanded="false" hidden>More</button>
      </section>
    </div>
  </div>
  <script src="landing.js"></script>
</body>
</html>
