<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f5">
  <title>NP — Purchase plan</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <p><a class="back" href="/">&larr; Services</a></p>
    <h1>Purchase plan</h1>
    <p class="subtitle">Items in the order you plan to buy them.</p>

    <form class="entry" id="item-form">
      <label>Name <input id="item-name" type="text" maxlength="120" required autocomplete="off"></label>
      <label>Price <input id="item-price" type="number" min="0" max="100000000" step="0.01" required inputmode="decimal"></label>
      <label>Link <input id="item-link" type="url" maxlength="2048" placeholder="https://" autocomplete="off"></label>
      <button type="submit">Add item</button>
    </form>

    <ol class="items" id="item-list"></ol>
    <p class="empty" id="empty-state" hidden>Nothing planned yet.</p>
    <p class="total" id="total"></p>
    <p class="message" id="message" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
